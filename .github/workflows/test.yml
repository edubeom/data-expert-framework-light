name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false   # 한 환경이 실패해도 나머지 결과를 다 본다
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
        include:
          - os: macos-latest      # /bin/sh 가 bash 3.2 -- 커밋 훅이 여기서 실제로 돈다
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ matrix.python }}" }
      - name: tests (실패하면 실패한 시험 이름과 마지막 줄을 주석(annotation)으로 -- 로그를 못 여는 곳에서도 원인이 보이게)
        shell: bash
        env: { PYTHONIOENCODING: utf-8 }
        run: |
          set +e
          python -X dev -W error::ResourceWarning tests/test_datalight.py > test.log 2>&1
          code=$?
          cat test.log
          if [ $code -ne 0 ]; then
            grep -E '^(FAIL|ERROR):' test.log | head -8 | while IFS= read -r l; do echo "::error title=failed test::$l"; done
            grep -E 'Error|assert' test.log | grep -v '^Traceback' | head -8 | while IFS= read -r l; do echo "::error title=detail::$l"; done
          fi
          exit $code
      - name: example passes the gate (with mutation check)
        run: python skills/data-light/scripts/datalight.py verify skills/data-light/examples/shop/data/model.light.json --mutate
